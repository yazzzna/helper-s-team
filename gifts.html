<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d16">
  <title>Рулетка подарков — Helper's Team TULA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="На главную">
      <img class="brand-logo" src="logo.png" alt="BLACK RUSSIA">
      <span class="brand-name">HELPER'S TEAM <b>TULA</b></span>
    </a>
    <a class="back-link" href="index.html">← Все рулетки</a>
  </header>

  <main class="container">
    <section class="page-heading">
      <p class="eyebrow">РУЛЕТКА № 03</p>
      <h1>Рулетка <span>подарков</span></h1>
      <p>Никаких догадок — только случайный выбор и приятные сюрпризы.</p>
    </section>

    <section class="game-layout game-layout-single">
      <div class="game-main">
        <div class="game-panel gifts-game-panel">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">ЧТО ТЕБЕ ДОСТАНЕТСЯ?</p>
              <h2 id="giftTitle">Твой подарок</h2>
            </div>
            <span class="panel-symbol" aria-hidden="true">✧</span>
          </div>

          <div class="gift-stage" id="giftStage" aria-live="polite">
            <div class="gift-placeholder" id="giftPlaceholder">
              <span class="gift-ribbon" aria-hidden="true">✧</span>
              <span>Твой сюрприз ждёт</span>
            </div>
            <div class="gift-result" id="giftResult" hidden></div>
          </div>

          <div class="ticker" id="giftTicker" aria-hidden="true">
            <span>✧</span>
            <span>✦</span>
            <span>✧</span>
            <span>✦</span>
            <span>✧</span>
          </div>

          <button class="primary-button" id="spinGift" type="button">
            Открыть подарок <span aria-hidden="true">↗</span>
          </button>

          <p class="status-message" id="giftStatus" aria-live="polite">
            Готова узнать, что тебе выпадет?
          </p>
        </div>
      </div>

      <aside class="game-sidebar">
        <div class="selector-panel">
          <p class="panel-kicker">ВЫБЕРИ РУЛЕТКУ</p>
          <h2>Какой сюрприз?</h2>

          <div class="roulette-options" id="giftTypes">
            <button class="roulette-option active" type="button" data-type="normal">
              <span class="option-icon">✧</span>
              <span class="option-text">
                <strong>Обычная</strong>
                <small>Классический сюрприз</small>
              </span>
              <span class="option-arrow">›</span>
            </button>

            <button class="roulette-option" type="button" data-type="special">
              <span class="option-icon">✦</span>
              <span class="option-text">
                <strong>Особая</strong>
                <small>Что-то интересное</small>
              </span>
              <span class="option-arrow">›</span>
            </button>

            <button class="roulette-option" type="button" data-type="premium">
              <span class="option-icon">✹</span>
              <span class="option-text">
                <strong>Премиум</strong>
                <small>Сюрприз повесомее</small>
              </span>
              <span class="option-arrow">›</span>
            </button>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <footer class="site-footer">
    <p>HELPER'S TEAM TULA · BLACK RUSSIA</p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/gifts.js"></script>
</body>
</html>
